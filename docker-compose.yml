services:
  jenkins:
    build: .
    container_name: jenkins-tp
    ports:
      - "8080:8080"    # Jenkins UI
      - "50000:50000"  # Jenkins agent connector
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml  # Toujours utiliser le casc.yaml local
      - /var/run/docker.sock:/var/run/docker.sock
      - ./calculatrice:/opt/calculatrice           # Projet Calculatrice (TP4)
      - ./HelloWorld:/opt/HelloWorld               # Projet HelloWorld   (TP1/TP2)
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
    restart: unless-stopped

volumes:
  jenkins_home:
    name: jenkins_home
